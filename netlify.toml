[build]
publish = "."

[[headers]]
for = "/service-worker.js"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
  [headers.values]
  Cache-Control = "public, max-age=3600"

[[headers]]
for = "/src/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
